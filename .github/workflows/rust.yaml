name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/rust.yaml"
      - "webserver/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".rustfmt.toml"
      - "deny.toml"
      - "sgconfig.yml"
      - ".ast-grep/**"

jobs:
  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly (rustfmt)
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly
          components: rustfmt

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Cache cargo registry, git deps and target dir
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-deny
        run: |
          set -euo pipefail
          CARGO_DENY_VERSION=0.20.2
          curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin/ "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"

      - name: cargo fmt
        run: cargo +nightly fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace --all-features

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - name: cargo deny
        run: cargo deny --locked check
