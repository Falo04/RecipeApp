name: i18n

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - ".github/workflows/i18n.yaml"
      - "frontend/public/locales/**"
      - "frontend/src/**"
      - "tools/check-i18n.py"

permissions:
  contents: read

jobs:
  i18n:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check keys and namespaces
        run: python3 tools/check-i18n.py
