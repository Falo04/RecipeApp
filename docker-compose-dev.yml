name: "tavern-goblin-dev"

services:
  postgres:
    restart: unless-stopped
    shm_size: 128mb
    networks: [tavern-goblin-net]
    volumes:
      - postgres-vol:/var/lib/postgresql
    env_file: [.env]
    build:
      dockerfile: ./build/dockerfiles/postgres.Dockerfile

  frontend:
    restart: unless-stopped
    networks: [tavern-goblin-net]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file: [.env]
    build:
      dockerfile: ./build/dockerfiles/frontend-dev.Dockerfile

  webserver:
    labels:
      - webserver
    restart: unless-stopped
    depends_on: [postgres]
    networks: [tavern-goblin-net]
    stop_signal: SIGTERM
    volumes:
      - ./webserver/migrations:/migrations
    env_file: [.env]
    environment:
      - RUST_LOG=${RUST_LOG-info,webserver=debug}
    build:
      dockerfile: ./build/dockerfiles/webserver-dev.Dockerfile

  nginx:
    restart: unless-stopped
    networks: [tavern-goblin-net]
    ports:
      - "8080:443"
    depends_on: [webserver, frontend]
    env_file: [.env]
    volumes:
      - ./data/nginx/recipe-dev.conf:/etc/nginx/conf.d/default.conf
      - ./data/certs/local.crt:/certs/nginx.crt
      - ./data/certs/local.key:/certs/nginx.key
    build:
      dockerfile: ./build/dockerfiles/nginx-dev.Dockerfile

volumes:
  postgres-vol:
    name: ${COMPOSE_PROJECT_NAME}-postgres-vol-${DEV_TAG:-dev}

networks:
  tavern-goblin-net:
    driver: bridge
