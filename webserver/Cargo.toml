[package]
name = "webserver"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
regex = "~1"

# Secrets 
secrecy = { version = "~0.10", features = ["serde"] }

# Errors 
thiserror = { version = "~2" }
anyhow = { version = "~1" }

# Webframework
galvyn = { version = "~0.7", features = ["contrib-settings"] }
tower-http = { version = "~0.7", features = ["trace"] }

# Cli
clap = { version = "~4", features = ["derive"] }

# Async
tokio = { version = "~1", features = ["full"] }
futures-lite = { version = "~2" }
futures-util = { version = "~0.3" }

# Logging
tracing = { version = "~0.1" }            # Base API
tracing-subscriber = { version = "~0.3" }
tracing-forest = { version = "~0.3" }

# Serialization
serde = { version = "~1", features = ["derive"] }

# Datatypes
uuid = { version = "~1", features = ["serde", "v7"] }
url = { version = "~2", features = ["serde"] }
time = { version = "~0.3" }

# Authentication
openidconnect = { version = "~4" }
